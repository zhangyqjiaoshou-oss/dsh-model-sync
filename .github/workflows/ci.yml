# Auto-generated by scripts/ci.yml
# https://github.com/zhangyqjiaoshou-oss/dsh-model-sync/actions
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  typecheck:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx tsdown